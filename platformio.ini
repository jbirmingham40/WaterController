; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Only the real firmware builds/uploads by default. The touchtest diagnostic
; env is opt-in via `-e touchtest`, so a bare `pio run -t upload` can never
; flash it by mistake - doing so leaves the board running a program with no
; display, radio or web portal, which looks like the hardware has died.
[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
; Pinned by USB serial (the C6's MAC) - /dev/ttyACM* renumbers on replug,
; and the other board on this machine is an ESP32-C3 that will reject the image.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_AC:EB:E6:3C:94:08-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_AC:EB:E6:3C:94:08-if00
debug_tool = esp-builtin
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	adafruit/Adafruit MPR121 @ ^1.2.1
	moononournation/GFX Library for Arduino @ ^1.6.6
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
